name: CI/CD Workflow

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: mjeongriver/e-commerce-mall
      TAG: latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test  # 추후에 테스트 코드 포함하게 변경

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$TAG .

      - name: Push Docker image to Docker Hub
        run: docker push $IMAGE_NAME:$TAG

      - name: Deploy to App Server #1 via
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.APP_SERVER_HOST_1 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: root
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            echo "== Proxy SSH 접근 성공 =="
            echo "== 현재 위치: $(pwd)"
            echo "== 현재 유저: $(whoami)"
            echo "== Bastion 서버에서 App 서버로 SSH 접속 성공한 상태"
            ping -c 3 8.8.8.8 || echo "️외부 인터넷 불가"
            docker -v || echo "Docker 미설치"
            docker pull $IMAGE_NAME:$TAG
            docker compose -f docker-compose.app.yml down || true
            docker compose -f docker-compose.app.yml up -d
          #script: |
            # cd /root/e-commerce-mall
           # docker pull $IMAGE_NAME:$TAG
            #docker compose -f docker-compose.app.yml down || true
            #docker compose -f docker-compose.app.yml up -d

      - name: Deploy to App Server #2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.APP_SERVER_HOST_2 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: root
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/e-commerce-mall
            docker pull $IMAGE_NAME:$TAG
            docker compose -f docker-compose.app.yml down || true
            docker compose -f docker-compose.app.yml up -d
      

