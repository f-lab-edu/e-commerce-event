services:
  redis:
    image: redis:7.4
    container_name: redis_server_prod
    restart: always
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "no" ]
    networks:
      - ecommerce_network
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    environment:
      - REDIS_HOST=${SPRING_REDIS_HOST}
      - REDIS_PORT=${SPRING_REDIS_PORT}
    ports:
      - "5540:5540"
    networks:
      - ecommerce_network

volumes:
  redis_data_prod:

networks:
  ecommerce_network:
    driver: bridge