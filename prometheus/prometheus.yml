global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
         - 'e-commerce-mall-1:8080'
         - 'e-commerce-mall-2:8080'
         - 'e-commerce-mall-3:8080'
         - 'e-commerce-mall-4:8080'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
