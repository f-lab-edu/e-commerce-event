services:
  app:
    build:
      context: .
    container_name: e-commerce-mall
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker-dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/ecommerce?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce_network
    deploy:
      resources:
        limits:
          cpus: '4.0'

  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mysql_db
    restart: always
    command: --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ecommerce_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    networks:
      - ecommerce_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "5540:5540"
    networks:
      - ecommerce_network

  ngrinder-controller:
    image: ngrinder/controller
    container_name: ngrinder-controller
    platform: linux/amd64
    restart: always
    ports:
      - "8081:80"
      - "16001:16001"
      - "12000-12100:12000-12100"
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: "-Xms1024m -Xmx1024m -Dserver.port=80 -Dcontroller.port=16010 -Dngrinder.controller.ip=ngrinder-controller"
    networks:
      - ecommerce_network
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    volumes:
      - ngrinder_data:/opt/ngrinder-controller
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: always
    networks:
      - ecommerce_network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ecommerce_network

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ecommerce_network

volumes:
  db_data:
  redis_data:
  ngrinder_data:
  grafana_data:

networks:
  ecommerce_network:
    driver: bridge